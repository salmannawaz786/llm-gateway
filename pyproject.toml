[project]
name = "llm-gateway"
version = "0.1.0"
description = "A reliability-focused LLM gateway: hedged requests, circuit breaking, and semantic caching."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.28",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "structlog>=24.4",
    "prometheus-client>=0.21",
]

[project.optional-dependencies]
embeddings = ["sentence-transformers>=3.3"]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "hypothesis>=6.115",
    "mypy>=1.13",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gateway"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests", "chaos"]

# The optional embedding stack is not our code to type-check, and its stubs
# require a newer language target than the rest of the project. Skipping it
# keeps `mypy --strict` meaningful on the code we actually own.
[[tool.mypy.overrides]]
module = ["sentence_transformers.*", "numpy.*", "torch.*", "transformers.*"]
follow_imports = "skip"
ignore_missing_imports = true

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]
